    <script>
        window.onerror = function(msg, url, line, col, error) {
            var errDiv = document.createElement('div');
            errDiv.style.cssText = 'color:red; z-index:9999; position:absolute; top:0; left:0; background:white; padding:20px; font-size:20px; border:2px solid red;';
            errDiv.innerHTML = '<strong>Error:</strong> ' + msg + '<br>Line: ' + line + '<br>Col: ' + col + '<br>File: ' + url;
            document.body.appendChild(errDiv);
            return false;
        };
    </script>
